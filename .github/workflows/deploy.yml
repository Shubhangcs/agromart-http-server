name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o agromart-server .

      - name: Create PM2 ecosystem config
        run: |
          cat > ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [
              {
                name: "agromart-server",
                script: "/root/agromart/agromart-server",
                interpreter: "none",
                cwd: "/root/agromart",
                autorestart: true,
                watch: false,
                max_restarts: 10,
                restart_delay: 3000,
                env: {
                  PORT: "${{ secrets.PORT }}",
                  DATABASE_HOST: "${{ secrets.DATABASE_HOST }}",
                  DATABASE_PORT: "${{ secrets.DATABASE_PORT }}",
                  DATABASE_USER: "${{ secrets.DATABASE_USER }}",
                  DATABASE_NAME: "${{ secrets.DATABASE_NAME }}",
                  DATABASE_PASSWORD: "${{ secrets.DATABASE_PASSWORD }}",
                  DATABASE_SSL_MODE: "${{ secrets.DATABASE_SSL_MODE }}",
                  JWT_SECRET_KEY: "${{ secrets.JWT_SECRET_KEY }}",
                  JWT_TOKEN_ISSUER: "${{ secrets.JWT_TOKEN_ISSUER }}",
                  ACCESS_KEY: "${{ secrets.ACCESS_KEY }}",
                  SECRET_KEY: "${{ secrets.SECRET_KEY }}",
                  BUCKET_NAME: "${{ secrets.BUCKET_NAME }}",
                  REGION: "${{ secrets.REGION }}"
                }
              }
            ]
          };
          EOF

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/deploy_key
          EOF

      - name: Upload files to VM
        run: |
          scp \
            agromart-server \
            ecosystem.config.js \
            "${{ secrets.VM_USER }}@${{ secrets.VM_IP }}:/tmp/"

      - name: Deploy with PM2
        run: |
          ssh "${{ secrets.VM_USER }}@${{ secrets.VM_IP }}" bash << 'ENDSSH'
          set -e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          APP_DIR="/root/agromart"
          mkdir -p "$APP_DIR"

          pm2 delete agromart-server 2>/dev/null || true

          install -m 755 /tmp/agromart-server "$APP_DIR/agromart-server"
          cp /tmp/ecosystem.config.js "$APP_DIR/ecosystem.config.js"

          cd "$APP_DIR"
          pm2 start ecosystem.config.js
          pm2 save

          sleep 15

          echo "=== PM2 Status ==="
          pm2 status

          echo "=== App Logs ==="
          pm2 logs agromart-server --lines 30 --nostream 2>&1 || true

          STATUS=$(pm2 jlist 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((p['pm2_env']['status'] for p in d if p['name']=='agromart-server'),'not_found'))")
          echo "Process status: $STATUS"
          if [ "$STATUS" != "online" ]; then
            echo "ERROR: process is not online"
            exit 1
          fi
          echo "Deployment successful"
          ENDSSH
