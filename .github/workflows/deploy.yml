name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o agromart-server .

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat >> ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/deploy_key
          EOF

      - name: Upload binary to VM
        run: |
          scp \
            agromart-server \
            "${{ secrets.VM_USER }}@${{ secrets.VM_IP }}:/tmp/agromart-server"

      - name: Deploy application
        run: |
          ssh "${{ secrets.VM_USER }}@${{ secrets.VM_IP }}" bash << 'ENDSSH'

          set -e

          APP_DIR="/root/agromart"
          APP_NAME="agromart-server"
          APP_BINARY="$APP_DIR/$APP_NAME"
          PID_FILE="$APP_DIR/$APP_NAME.pid"
          LOG_FILE="$APP_DIR/$APP_NAME.log"

          mkdir -p "$APP_DIR"

          echo "=== Stopping existing application ==="

          if [ -f "$PID_FILE" ]; then
            PID=$(cat "$PID_FILE")

            if kill -0 "$PID" 2>/dev/null; then
              echo "Stopping process $PID"
              kill "$PID"

              # Wait for graceful shutdown
              for i in {1..10}; do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 1
              done

              # Force kill if still running
              if kill -0 "$PID" 2>/dev/null; then
                echo "Process did not stop gracefully, killing..."
                kill -9 "$PID"
              fi
            fi

            rm -f "$PID_FILE"
          fi

          echo "=== Installing new binary ==="

          install -m 755 /tmp/agromart-server "$APP_BINARY"

          rm -f /tmp/agromart-server

          echo "=== Starting application ==="

          cd "$APP_DIR"

          nohup "$APP_BINARY" > "$LOG_FILE" 2>&1 &

          NEW_PID=$!

          echo "$NEW_PID" > "$PID_FILE"

          echo "Started $APP_NAME with PID $NEW_PID"

          echo "=== Waiting for application ==="

          sleep 5

          echo "=== Process Status ==="

          if kill -0 "$NEW_PID" 2>/dev/null; then
            echo "Application is running"
          else
            echo "ERROR: Application failed to start"
            echo "=== Application Logs ==="
            tail -n 50 "$LOG_FILE"
            exit 1
          fi

          echo "=== Application Logs ==="

          tail -n 30 "$LOG_FILE"

          echo "=== Deployment successful ==="

          ENDSSH
